pcd_recorder_node:
  ros__parameters:
    input_topic: /livox/lidar
    message_type: pointcloud2
    # Relative paths are resolved from the directory where ros2 launch is run.
    output_dir: docs/livox_pcd
    save_duration_sec: 0.5
    save_binary: true
    save_on_shutdown: true
    save_once: true
